name: CI

on:
  pull_request:
  push:
    branches: [main]

# Grouped per ref so a push to a branch cancels only that branch's in-flight
# run. A main run is never cancelled by a PR's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # `test` is a required check from the start, so the branch protection is
    # final now. Until milestone 0 adds pyproject.toml there is no Python to
    # check, and every Python step is skipped; from then on they all run.
    # (hashFiles only works inside steps, hence the condition on each one.)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No Python project yet
        if: hashFiles('pyproject.toml') == ''
        run: echo "No pyproject.toml yet; the Python checks start with milestone 0."

      # uv reads the Python version from .python-version and installs it, and
      # caches the environment keyed on uv.lock.
      - name: Set up uv
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # tests exactly the dependencies that were committed.
      - name: Install
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --locked

      - name: Check formatting
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff format --check .

      - name: Lint
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff check .

      # Python's types are optional; pyright in strict mode makes them
      # required, the closest thing to Go's compiler for this codebase.
      - name: Type check
        if: hashFiles('pyproject.toml') != ''
        run: uv run pyright

      - name: Test
        if: hashFiles('pyproject.toml') != ''
        run: uv run pytest

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cross-linked design docs and lessons: a moved file breaks navigation
      # silently. Checks relative links only; external URLs are not fetched.
      - name: Check relative links resolve
        run: |
          fail=0
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken relative link: $link"
                fail=1
              fi
            done < <(grep -oP '\]\(\K[^)]+' "$file" | grep -Ev '^(https?:|mailto:|#)')
          done < <(find . -name '*.md' -not -path './.git/*' -not -path './.venv/*')
          exit "$fail"
