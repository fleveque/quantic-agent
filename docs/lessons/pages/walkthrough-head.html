<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F6F8F9; --surface:#FFFFFF; --surface-2:#EEF3F5;
  --ink:#111A1F; --ink-2:#3D4E56; --muted:#6B7F88; --rule:#DCE5E8;
  --accent:#007D99; --accent-soft:#E0F1F5; --accent-line:#8FC9D6;
  --aside:#6D4C8C; --aside-soft:#F1EBF7; --aside-line:#C3AEDB;
  --warn:#9A5B08; --warn-soft:#FAF0DE; --warn-line:#E2BE7F;
  --ok:#2F7A4A; --ok-soft:#E4F3E9; --ok-line:#9BD0AE;
  --term-bg:#0B1419; --term-ink:#CFE0E6; --term-dim:#63808C;
  --shadow:0 1px 2px rgba(17,26,31,.05), 0 8px 24px -12px rgba(17,26,31,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1418; --surface:#121D22; --surface-2:#17242A;
    --ink:#E9F1F4; --ink-2:#B2C3CA; --muted:#7C939C; --rule:#22343B;
    --accent:#4FC9E4; --accent-soft:#0E323C; --accent-line:#215E6E;
    --aside:#BCA2DE; --aside-soft:#211A2E; --aside-line:#4C3D68;
    --warn:#E3A94F; --warn-soft:#2E2311; --warn-line:#6A5324;
    --ok:#7FD1A0; --ok-soft:#10271A; --ok-line:#2C5A3D;
    --term-bg:#07100F; --term-ink:#CFE0E6; --term-dim:#5E7B86;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1418; --surface:#121D22; --surface-2:#17242A;
  --ink:#E9F1F4; --ink-2:#B2C3CA; --muted:#7C939C; --rule:#22343B;
  --accent:#4FC9E4; --accent-soft:#0E323C; --accent-line:#215E6E;
  --aside:#BCA2DE; --aside-soft:#211A2E; --aside-line:#4C3D68;
  --warn:#E3A94F; --warn-soft:#2E2311; --warn-line:#6A5324;
  --ok:#7FD1A0; --ok-soft:#10271A; --ok-line:#2C5A3D;
  --term-bg:#07100F; --term-ink:#CFE0E6; --term-dim:#5E7B86;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16.5px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
code,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

.wrap{max-width:1120px; margin:0 auto; padding:0 28px 96px}
@media (max-width:480px){ .wrap{padding:0 16px 72px} }

/* ---- masthead ---- */
.masthead{border-bottom:1px solid var(--rule); padding:44px 0 28px; margin-bottom:44px}
.kicker{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  font-weight:600; color:var(--muted); margin-bottom:22px;
}
.kicker .num{
  color:var(--accent); background:var(--accent-soft);
  border:1px solid var(--accent-line); border-radius:3px;
  padding:2px 7px; letter-spacing:.1em;
}
.kicker .sep{color:var(--rule)}
h1{
  font-family:Newsreader,Georgia,serif; font-optical-sizing:auto;
  font-weight:500; font-size:clamp(2.3rem,5.4vw,3.5rem); line-height:1.08;
  letter-spacing:-.015em; margin:0 0 18px; text-wrap:balance; max-width:18ch;
}
.standfirst{font-size:1.13rem; color:var(--ink-2); max-width:64ch; margin:0 0 26px; line-height:1.58}
.meta{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  font-size:12.5px; color:var(--ink-2); background:var(--surface);
  border:1px solid var(--rule); border-radius:999px; padding:4px 13px;
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
}
a.chip:hover{border-color:var(--accent-line); color:var(--accent)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* ---- layout ---- */
.cols{display:grid; grid-template-columns:1fr; gap:0}
@media (min-width:980px){
  .cols{grid-template-columns:210px minmax(0,1fr); gap:52px; align-items:start}
  .rail{position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto}
}
.rail{font-size:12.5px}
.rail-h{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  color:var(--muted); padding-bottom:10px; border-bottom:1px solid var(--rule); margin:18px 0 10px;
}
.rail-h:first-child{margin-top:0}
.rail ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.rail a{color:var(--ink-2); text-decoration:none; display:flex; gap:8px; line-height:1.35}
.rail a .n{color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:11px; min-width:1.6em; padding-top:1px}
.rail a:hover{color:var(--accent)}
@media (max-width:979px){ .rail{display:none} }

article{min-width:0; max-width:76ch}
.part{
  margin:64px 0 8px; padding-top:18px; border-top:2px solid var(--ink);
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--muted);
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.part:first-child{margin-top:0}
.part b{color:var(--ink); font-weight:600}
.part code{text-transform:none; letter-spacing:0}
h2{
  font-family:Newsreader,Georgia,serif; font-weight:600;
  font-size:1.66rem; line-height:1.22; letter-spacing:-.01em;
  margin:48px 0 4px; text-wrap:balance; scroll-margin-top:24px;
  display:flex; gap:14px; align-items:baseline;
}
.part + h2{margin-top:20px}
h2 .step{
  flex:none; font-family:"IBM Plex Mono",monospace; font-size:.8rem; font-weight:600;
  color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line);
  border-radius:4px; padding:1px 7px; position:relative; top:-3px;
}
.dek{color:var(--muted); font-size:.94rem; margin:0 0 20px}
h3{
  font-size:.82rem; letter-spacing:.11em; text-transform:uppercase; font-weight:600;
  color:var(--muted); margin:30px 0 10px;
}
p{margin:0 0 17px}
article ul, article ol.plain{margin:0 0 17px; padding-left:1.15em}
article li{margin-bottom:8px}
strong{font-weight:600; color:var(--ink)}
a{color:var(--accent)}
code:not(pre code){
  font-size:.885em; background:var(--surface-2); border:1px solid var(--rule);
  border-radius:4px; padding:1px 5px; color:var(--ink); overflow-wrap:anywhere;
}

/* ---- code excerpts ---- */
figure.code{margin:0 0 20px; border:1px solid var(--rule); border-radius:7px; overflow:hidden; background:var(--surface-2)}
figure.code figcaption{
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
  padding:7px 14px; border-bottom:1px solid var(--rule); background:var(--surface);
}
figure.code .file{color:var(--ink-2); font-weight:500}
pre{
  margin:0; padding:14px 16px; overflow-x:auto; font-size:13.4px; line-height:1.68;
  color:var(--ink); tab-size:4; background:var(--surface-2);
}
pre.bare{border:1px solid var(--rule); border-radius:7px; margin:0 0 20px}
.hljs-comment{color:var(--muted); font-style:italic}
.hljs-keyword,.hljs-built_in,.hljs-type{color:var(--aside)}
.hljs-string{color:var(--warn)}
.hljs-number,.hljs-literal{color:var(--accent)}
.hljs-title,.hljs-title.function_{color:var(--accent); font-weight:500}
.hljs-meta{color:var(--muted)}

.term{
  background:var(--term-bg); border:1px solid var(--rule); border-radius:7px;
  padding:14px 16px; overflow-x:auto; font-size:13.2px; line-height:1.66;
  color:var(--term-ink); margin:0 0 20px; white-space:pre; font-family:"IBM Plex Mono",monospace;
}
.term .prompt{color:var(--term-dim); user-select:none}
.term .dim{color:var(--term-dim)}
.term .err{color:#F08A6E}
.term .ok{color:#8FD3A8}

/* ---- asides ---- */
.aside{
  border-left:3px solid var(--aside-line); background:var(--aside-soft);
  border-radius:0 7px 7px 0; padding:14px 18px; margin:0 0 22px;
}
.aside .tag{
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600;
  color:var(--aside); display:block; margin-bottom:6px;
}
.aside p:last-child,.aside ul:last-child{margin-bottom:0}
.gotcha{border-left-color:var(--warn-line); background:var(--warn-soft)}
.gotcha .tag{color:var(--warn)}
.try{border-left-color:var(--ok-line); background:var(--ok-soft)}
.try .tag{color:var(--ok)}
.try .term{margin:10px 0 10px}

/* ---- tables ---- */
.tbl-scroll{overflow-x:auto; margin:0 0 22px; border:1px solid var(--rule); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:560px}
th,td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--rule); vertical-align:top}
thead th{
  font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted);
  font-weight:600; background:var(--surface-2); white-space:nowrap;
}
tbody tr:last-child td{border-bottom:none}
td:first-child{color:var(--ink); font-weight:500}
td code{font-size:.85em}

/* ---- reading map ---- */
.map{
  background:var(--surface); border:1px solid var(--rule); border-radius:8px;
  box-shadow:var(--shadow); margin:0 0 24px; overflow:hidden;
}
.map-body{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:10px; align-items:center; padding:20px}
@media (max-width:720px){
  .map-body{grid-template-columns:1fr}
  .map-arrow{transform:rotate(90deg); justify-self:center}
}
.node{border:1px solid var(--rule); border-radius:7px; padding:12px 14px; background:var(--surface-2)}
.node.core{border-color:var(--accent-line); background:var(--accent-soft)}
.node.ext{border-style:dashed; background:transparent}
.node h4{margin:0 0 6px; font-family:"IBM Plex Mono",monospace; font-size:13.5px; font-weight:600}
.node ul{list-style:none; margin:0; padding:0; font-size:12.5px; color:var(--ink-2); display:flex; flex-direction:column; gap:3px}
.node li{margin:0; display:flex; gap:7px; align-items:baseline}
.node .o{
  flex:none; font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:600; color:var(--accent);
  border:1px solid var(--accent-line); border-radius:50%; width:17px; height:17px;
  display:inline-flex; align-items:center; justify-content:center; background:var(--surface);
}
.node .file{font-family:"IBM Plex Mono",monospace}
.map-arrow{color:var(--muted); font-size:13px; text-align:center; line-height:1.2; font-family:"IBM Plex Mono",monospace}
.map-arrow span{display:block; font-size:10.5px}
.map-side{grid-column:1 / 2}
.map-cap{border-top:1px solid var(--rule); padding:10px 20px; font-size:12.5px; color:var(--muted); background:var(--surface-2)}

/* ---- takeaways ---- */
.takeaways{
  background:var(--surface); border:1px solid var(--rule); border-radius:8px;
  padding:20px 22px; box-shadow:var(--shadow); margin:0 0 22px;
}
.takeaways ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.takeaways li{display:flex; gap:12px; align-items:flex-start; margin:0; line-height:1.55}
.takeaways .mk{
  flex:none; width:19px; height:19px; border-radius:50%; margin-top:2px;
  background:var(--accent-soft); border:1px solid var(--accent-line);
  color:var(--accent); font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}

.foot{
  margin-top:56px; padding-top:22px; border-top:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:baseline;
  font-size:13px; color:var(--muted);
}
.foot a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
